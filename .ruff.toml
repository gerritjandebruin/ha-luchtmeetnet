# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "CPY001", # no copyright headers, like Home Assistant core
    "ARG001", # HA callbacks have fixed signatures
    "ARG004",
    "D102", # self-explanatory entity properties
    "D107", # __init__ documented by the class
    "TC001", # runtime imports are fine in an integration
    "TC002",
    "TC003",
    "EM102", # f-strings in exception messages are fine
    "TRY003",
    "PLR2004", # HTTP status codes are not magic
]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
